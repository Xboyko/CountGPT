name: Launch check

on:
  push:
  pull_request:

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse launcher with Windows PowerShell 5.1
        shell: powershell
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'start.ps1'), [ref]$parseTokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Output $_.ToString() }
            exit 1
          }
  launch-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n start.sh and entrypoint
        run: |
          bash -n start.sh
          bash -n docker/entrypoint.sh
      - name: docker compose config
        run: docker compose -f docker-compose.yml config -q
      - name: Launch tests
        run: python -m unittest tests.test_launch
