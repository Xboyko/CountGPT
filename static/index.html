<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CountGPT</title>
    <meta
      name="description"
      content="Local NIST SP 800-53 assistant for control lookup and POA&amp;M drafting."
    />
    <link rel="stylesheet" href="/static/styles.css?v=20260913" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a href="/" class="brand">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="22" height="22">
              <rect x="3" y="4" width="26" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <path d="M10 12h12M10 16.5h8M10 21h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="brand-name">CountGPT</span>
        </a>
        <nav class="shell-nav" aria-label="Primary">
          <a href="/" class="nav-link active" aria-current="page">Chat</a>
          <a href="/workbench" class="nav-link">Workbench</a>
          <a href="/guide" class="nav-link">Guide</a>
        </nav>
        <div class="top-actions">
          <button type="button" id="btn-history-open" class="btn ghost history-open">Chats</button>
          <span id="health-pill" class="pill pill-unknown" title="Checking backendâ€¦">Checking</span>
        </div>
      </header>

      <p class="disclaimer" role="note">
        <strong>Draft / not assessor-validated.</strong>
        Learning only â€” not an ATO or eMASS artifact.
      </p>

      <div id="chat-shell" class="chat-shell">
        <aside id="history-sidebar" class="history-pane" aria-label="Chat history">
          <div class="history-head">
            <div class="history-head-text">
              <h2>Chats</h2>
              <p class="history-hint">Saved on this device</p>
            </div>
            <button type="button" id="btn-history-close" class="btn icon history-close" aria-label="Hide chat history">Ã—</button>
            <button type="button" id="btn-history-expand" class="btn icon history-expand" aria-label="Show chat history">â€º</button>
          </div>
          <button type="button" id="btn-new" class="btn primary history-new">New chat</button>
          <nav id="history-list" class="history-list" aria-label="Saved chats"></nav>
        </aside>

        <main class="chat-pane">
          <div id="messages" class="messages" aria-live="polite"></div>

          <form id="composer" class="composer">
            <label class="sr-only" for="input">Message</label>
            <textarea
              id="input"
              rows="1"
              placeholder="Ask about a control (e.g. What does AC-2 require?) or draft a POA&amp;Mâ€¦"
              autocomplete="off"
            ></textarea>
            <div class="composer-actions">
              <button type="submit" id="btn-send" class="btn primary">Send</button>
              <button type="button" id="btn-sources" class="btn ghost sources-toggle" aria-expanded="false">
                Sources <span id="sources-count" class="count-badge hidden"></span>
              </button>
              <button type="button" id="btn-export-md" class="btn ghost" disabled>Export MD</button>
              <button type="button" id="btn-export-csv" class="btn ghost" disabled>Export CSV</button>
            </div>
          </form>
        </main>
      </div>
    </div>

    <aside id="sources-panel" class="sources-pane" aria-label="Retrieved controls" aria-hidden="true">
      <div class="sources-head">
        <h2>Sources</h2>
        <span id="sources-mode" class="mode-tag hidden"></span>
        <button type="button" id="btn-close-sources" class="btn icon sources-toggle" aria-label="Close sources">Ã—</button>
      </div>
      <p id="sources-status" class="sources-status" hidden></p>
      <p id="sources-empty" class="sources-empty">
        No retrieval yet. Ask a question or name a control ID (for example
        <code>AC-2</code>). Matching controls appear here after an answer.
      </p>
      <div id="sources-list" class="sources-list" hidden></div>
    </aside>

    <div id="sources-backdrop" class="backdrop" hidden></div>
    <div id="history-backdrop" class="backdrop" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="/static/sources.js?v=20260913"></script>
    <script src="/static/history.js?v=20260913"></script>
    <script src="/static/app.js?v=20260913"></script>
  </body>
</html>
